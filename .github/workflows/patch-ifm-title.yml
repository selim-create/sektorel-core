name: Patch IFM title extraction

on:
  push:
    branches:
      - phase3/fix-ifm-calendar-titles

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3/fix-ifm-calendar-titles
          fetch-depth: 0
      - name: Patch IFM adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('includes/admin/class-event-source-ifm.php')
          s = p.read_text()
          old = "$title = self::first_text( $xpath, array( '//h1', '//main//h2[1]', '//h2[1]' ) );"
          new = "$title = self::first_text( $xpath, array( '//h4[1]', '//h1', '//main//h2[1]', '//h2[1]' ) );"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new)
          needle = """        $candidate_id = ! empty( $existing[0] ) ? absint( $existing[0] ) : 0;\n        $record_hash  = sha1( wp_json_encode( array(\n"""
          replacement = """        if ( empty( $existing ) && ! empty( $record['detail_url'] ) ) {\n            $existing = get_posts( array(\n                'post_type'      => 'event_candidate',\n                'post_status'    => 'any',\n                'posts_per_page' => 1,\n                'fields'         => 'ids',\n                'meta_key'       => 'ifm_detail_url',\n                'meta_value'     => esc_url_raw( $record['detail_url'] ),\n                'no_found_rows'  => true,\n            ) );\n        }\n\n        $candidate_id = ! empty( $existing[0] ) ? absint( $existing[0] ) : 0;\n        $record_hash  = sha1( wp_json_encode( array(\n"""
          assert s.count(needle) == 1, s.count(needle)
          s = s.replace(needle, replacement)
          p.write_text(s)

          p = Path('sektorel-core.php')
          s = p.read_text()
          assert s.count('Version: 1.43.9') == 1, s.count('Version: 1.43.9')
          p.write_text(s.replace('Version: 1.43.9', 'Version: 1.44.0'))
          PY
      - name: Verify patch
        run: |
          grep -F "array( '//h4[1]', '//h1'" includes/admin/class-event-source-ifm.php
          grep -F "'meta_key'       => 'ifm_detail_url'" includes/admin/class-event-source-ifm.php
          grep -F 'Version: 1.44.0' sektorel-core.php
          php -l includes/admin/class-event-source-ifm.php
          php -l sektorel-core.php
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/admin/class-event-source-ifm.php sektorel-core.php
          git commit -m 'Fix IFM event title extraction and candidate reuse'
          git push origin HEAD:phase3/fix-ifm-calendar-titles
