name: PHP Syntax

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: php-syntax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Verify Core require paths
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if [ ! -f "$path" ]; then
              echo "Missing required file: $path"
              missing=1
            fi
          done < <(
            php -r '
              $source = file_get_contents("sektorel-core.php");
              preg_match_all("/require_once\\s+SEKTOREL_CORE_PATH\\s*\\.\\s*[\x27\x22]([^\x27\x22]+)[\x27\x22]\\s*;/", $source, $matches);
              foreach ($matches[1] as $path) {
                  echo $path, PHP_EOL;
              }
            '
          )

          if [ "$missing" -ne 0 ]; then
            echo "One or more static Core require paths do not exist."
            exit 1
          fi

          echo "All static Core require paths exist."
