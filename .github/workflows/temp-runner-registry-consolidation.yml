name: Temp Runner Registry Consolidation

on:
  push:
    branches:
      - refactor/background-runner-registry-consolidation-1439

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/background-runner-registry-consolidation-1439
          fetch-depth: 0
      - name: Consolidate runner registry and nonce flow
        shell: bash
        run: |
          echo '' | base64 -d | python
      - name: Lint touched PHP
        run: |
          php -l includes/admin/class-event-source-background-run.php
          php -l includes/admin/class-event-source-module.php
          php -l sektorel-core.php
      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Core 1.43.9: consolidate background runner registry and nonce flow"
          git push origin HEAD:refactor/background-runner-registry-consolidation-1439
