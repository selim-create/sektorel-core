name: Temp Version 1438

on:
  push:
    branches:
      - refactor/background-runner-callback-cleanup-1438

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/background-runner-callback-cleanup-1438
          fetch-depth: 0
      - name: Bump Core version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sektorel-core.php')
          s=p.read_text()
          old=' * Version: 1.43.7'
          new=' * Version: 1.43.8'
          if s.count(old)!=1:
              raise SystemExit(f'expected one old version, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sektorel-core.php
          git commit -m "Core 1.43.8: bump version"
          git push origin HEAD:refactor/background-runner-callback-cleanup-1438
